[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-owner-finder"
version = "0.1.0"
description = "Video-grounded storage owner finder MVP"
requires-python = ">=3.10"
dependencies = [
    "pydantic==2.11.4",
    "playwright==1.52.0",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

